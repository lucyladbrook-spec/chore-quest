<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chore Quest">
<meta name="theme-color" content="#191b1f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Chore Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191b1f; --card:#232527; --card2:#2d3035; --ink:#ffffff; --soft:#a3a6ab; --line:#393b3d;
  --brand:#335fff; --good:#00b06f; --warn:#f2a900; --bad:#e2231a; --save:#00a2ff; --gold:#ffc83d; --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0 0 8px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:19px} h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
b{font-weight:800}
.muted{color:var(--soft);font-size:14px;font-weight:500}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:800;border:0;border-radius:8px;padding:12px 16px;background:var(--brand);color:#fff;cursor:pointer;transition:transform .08s,filter .15s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.08)}
button.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
button.good{background:var(--good)} button.bad{background:var(--bad)} button.save{background:var(--save)}
button.small{padding:8px 12px;font-size:14px}
button:disabled{opacity:.4}
input,select{font:inherit;font-weight:600;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);border-color:transparent}
label{display:block;font-size:13px;color:var(--soft);margin:10px 0 4px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-weight:900;font-size:20px;white-space:nowrap;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .cr{width:20px;height:20px}
.pill{display:inline-block;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:800;background:var(--card2);color:var(--ink)}
.pill.warn{background:rgba(242,169,0,.15);color:var(--warn)} .pill.good{background:rgba(0,176,111,.15);color:var(--good)} .pill.bad{background:rgba(226,35,26,.15);color:#ff5a52}
.cr{display:inline-block;flex:none;width:.85em;height:.85em;margin:0 .22em -.06em .1em;border-radius:2px;transform:rotate(45deg);
  background:linear-gradient(135deg,#ffe48a,var(--gold) 45%,#d99a00);box-shadow:inset 0 0 0 .12em rgba(0,0,0,.18)}
.kidpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kidbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:18px 10px;border-radius:12px;text-align:center;font-size:17px}
.kidbtn:hover{border-color:var(--brand)}
.av{display:inline-flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:14px;font-size:34px;font-weight:900;color:#fff;margin-bottom:10px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.av.sm{width:40px;height:40px;font-size:19px;border-radius:9px;margin:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.av.md{width:52px;height:52px;font-size:24px;border-radius:11px;margin:0}
.wallet{border-radius:var(--r);padding:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden}
.wallet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.wallet.spend::before{background:var(--gold)}
.wallet.saveb::before{background:var(--save)}
.wallet .big{font-size:30px;font-weight:900;display:flex;align-items:center}
.wallet .sub{font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wallet .sub2{font-size:13px;color:var(--soft);font-weight:600}
.bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:5px}
.days{display:flex;gap:6px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:var(--soft);font-weight:700}
.day b{display:block;height:30px;border-radius:6px;background:var(--card2);margin-bottom:4px;line-height:30px;font-size:15px}
.day.on b{background:var(--good);color:#fff}
.day.today b{outline:2px solid var(--brand);outline-offset:1px}
.chore{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.chore:first-of-type{border-top:0}
.chore .em{font-size:22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:9px;flex:none}
.chore .nm{flex:1;font-weight:700}
.tick{min-width:84px;background:var(--good)}
.tick.bad{background:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{background:var(--card);color:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1}
.rew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rew button{background:var(--card2);color:var(--ink);border:1px solid var(--line);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.rew button .em{font-size:26px}
.rew button small{color:var(--soft);font-weight:600;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.pin{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pin input{width:56px;text-align:center;font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;z-index:60;font-weight:800;max-width:90%}
.sync{font-size:12px}
.daypick{display:flex;gap:4px}
.daypick span{flex:1;text-align:center;padding:8px 0;border-radius:6px;background:var(--card2);font-size:13px;cursor:pointer;font-weight:700}
.daypick span.on{background:var(--brand);color:#fff}
.colours{display:flex;gap:8px;flex-wrap:wrap}
.colours span{width:38px;height:38px;border-radius:8px;cursor:pointer;border:3px solid transparent}
.colours span.on{border-color:#fff}
.note{background:rgba(242,169,0,.1);border:1px solid rgba(242,169,0,.35);border-radius:8px;padding:12px;font-size:14px;font-weight:600}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:13px;word-break:break-all}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:380px){.shop{grid-template-columns:1fr 1fr}}
.shopitem{background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.shopitem .art{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.shopitem .art .tag{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;padding:3px 6px;border-radius:4px;background:rgba(0,0,0,.45);color:#fff;text-transform:uppercase;letter-spacing:.04em}
.shopitem .info{padding:8px 9px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.shopitem .nm{font-weight:800;font-size:14px;line-height:1.2}
.shopitem .price{font-weight:900;font-size:15px;display:flex;align-items:center}
.shopitem .val{font-size:12px;color:var(--soft);font-weight:600}
.shopitem button{margin-top:auto;padding:9px 6px;font-size:14px;background:var(--good)}
.shopitem button:disabled{background:var(--line);color:var(--soft);opacity:1}
.shopitem .mini{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:2px}
.shopitem .mini i{display:block;height:100%;background:var(--gold)}
.lb{display:flex;flex-direction:column;gap:8px}
.lbrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--card2);border:1px solid transparent}
.lbrow.me{border-color:var(--brand)}
.lbrow .rk{width:28px;text-align:center;font-weight:900;font-size:18px}
.lbrow .grow{flex:1;min-width:0}
.lbrow .nm{font-weight:800;display:flex;justify-content:space-between;gap:6px}
.lbrow .bar{height:7px;margin-top:5px}
.lbrow .meta{font-size:12px;color:var(--soft);font-weight:600;margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

function loadCfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; }catch(e){ return {}; } }
function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }
let cfg = loadCfg();
// Setup link: #db=<url>&fam=<code>
(function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if(h.get('db') && h.get('fam')){
    cfg.db = h.get('db').replace(/\/+$/,''); cfg.fam = h.get('fam');
    saveCfg(cfg); history.replaceState(null,'',location.pathname+location.search);
  }
})();
const remote = () => !!(cfg.db && cfg.fam);
const famUrl = (p='') => `${cfg.db}/families/${encodeURIComponent(cfg.fam)}${p}.json`;

/* ---------- Store ---------- */
let S = null, syncState = 'loading', es = null, pendingMig = null;

function setPath(obj, path, val){
  const parts = path.split('/'); let o = obj;
  for(let i=0;i<parts.length-1;i++){ if(typeof o[parts[i]] !== 'object' || o[parts[i]]===null) o[parts[i]] = {}; o = o[parts[i]]; }
  const last = parts[parts.length-1];
  if(val === null || val === undefined) delete o[last]; else o[last] = val;
}
function normalise(s){
  const d = defaultState();
  s = s || d;
  for(const k of ['kids','chores','log','wallets','claims','history']) s[k] = s[k] || {};
  s.settings = Object.assign({}, d.settings, s.settings||{});
  s.settings.minClaim = Object.assign({}, d.settings.minClaim, s.settings.minClaim||{});
  const mig = {};
  if(!s.settings.addedTom){ if(!Object.values(s.kids).some(k=>/^tom$/i.test(k.name||''))){ s.kids.k3={name:'Tom', colour:'#00b06f'}; mig['kids/k3']=s.kids.k3; } s.settings.addedTom=true; mig['settings/addedTom']=true; }
  if(!s.settings.amePhoto){ const e=Object.entries(s.kids).find(([,k])=>/^amelie$/i.test(k.name||'')); if(e && !e[1].photo){ e[1].photo=AMELIE_PHOTO; mig[`kids/${e[0]}/photo`]=AMELIE_PHOTO; } s.settings.amePhoto=true; mig['settings/amePhoto']=true; }
  if(!s.settings.tomPhoto){ const e=Object.entries(s.kids).find(([,k])=>/^tom$/i.test(k.name||'')); if(e && !e[1].photo){ e[1].photo=TOM_PHOTO; mig[`kids/${e[0]}/photo`]=TOM_PHOTO; } s.settings.tomPhoto=true; mig['settings/tomPhoto']=true; }
  pendingMig = mig;
  for(const c of Object.values(s.chores)) c.days = Array.isArray(c.days) ? c.days : Object.values(c.days||{});
  return s;
}

async function load(){
  if(!remote()){
    try{ S = normalise(JSON.parse(localStorage.getItem(LOCAL_KEY))); }catch(e){ S = normalise(null); }
    syncState = 'local'; afterLoad(); return;
  }
  try{
    const r = await fetch(famUrl());
    if(!r.ok) throw new Error('HTTP '+r.status);
    let data = await r.json();
    if(!data){ data = defaultState(); await fetch(famUrl(), {method:'PUT', body:JSON.stringify(data)}); }
    S = normalise(data); syncState = 'live';
    listen();
  }catch(e){
    syncState = 'offline';
    try{ S = normalise(JSON.parse(localStorage.getItem(LOCAL_KEY+'.cache'))); }catch(_){ S = normalise(null); }
  }
  afterLoad();
}
function afterLoad(){ if(pendingMig && Object.keys(pendingMig).length){ const m=pendingMig; pendingMig=null; commit(m); } applyInterest(); render(); }

let refetchT = null;
function listen(){
  if(es) es.close();
  try{
    es = new EventSource(famUrl());
    const onEvt = () => { clearTimeout(refetchT); refetchT = setTimeout(refetch, 250); };
    es.addEventListener('put', onEvt); es.addEventListener('patch', onEvt);
    es.onerror = () => { syncState = 'reconnecting'; renderSync(); };
    es.onopen = () => { syncState = 'live'; renderSync(); };
  }catch(e){}
  setInterval(refetch, 30000); // backup poll
}
async function refetch(){
  try{
    const r = await fetch(famUrl()); if(!r.ok) return;
    S = normalise(await r.json()); syncState = 'live';
    try{ localStorage.setItem(LOCAL_KEY+'.cache', JSON.stringify(S)); }catch(e){}
    if(!modalOpen) render(); else renderSync();
  }catch(e){}
}

// updates: { "path/to/x": value|null, ... }
async function commit(updates){
  for(const [p,v] of Object.entries(updates)) setPath(S, p, v);
  if(!remote()){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(S)); }catch(e){} render(); return true; }
  render();
  try{
    const r = await fetch(famUrl(), {method:'PATCH', body:JSON.stringify(updates)});
    if(!r.ok) throw new Error();
    return true;
  }catch(e){ toast('Couldn\'t save – check the connection'); return false; }
}

function notify(msg){
  const t = S.settings.ntfyTopic;
  if(!t) return;
  fetch('https://ntfy.sh/'+encodeURIComponent(t), {method:'POST', body:msg, headers:{'Title':'Chore Stars','Tags':'star'}}).catch(()=>{});
}

/* ---------- Money logic ---------- */
function wallet(kid){ return Object.assign({spend:0, savings:0, weekMin:0, weekKey:weekKey(today()), lastInterestWeek:weekKey(today()), bonusWeeks:{}}, S.wallets[kid]||{}); }
function hist(kid, text, delta, pot){ return {[`history/${uid()}`]:{kid, text, delta:r1(delta), pot, ts:Date.now()}}; }

// Interest: paid each Monday on the LOWEST savings balance held through the previous full week.
// So money must sit in the bank a whole week to earn — no gaming it by depositing on Sunday night.
function applyInterest(){
  const ups = {}; const thisWeek = weekKey(today());
  for(const kid of Object.keys(S.kids)){
    const w = wallet(kid);
    if(!S.wallets[kid]){ ups[`wallets/${kid}`] = w; continue; }
    if(w.lastInterestWeek >= thisWeek) continue;
    let savings = w.savings, min = Math.min(w.weekMin, w.savings), wk = w.lastInterestWeek, earned = 0;
    while(wk < thisWeek){
      const i = Math.min(r1(min * S.settings.interestRate/100), S.settings.interestCap);
      savings = r1(savings + i); earned += i;
      min = savings; wk = addDays(wk, 7);
    }
    ups[`wallets/${kid}/savings`] = savings;
    ups[`wallets/${kid}/weekMin`] = savings;
    ups[`wallets/${kid}/weekKey`] = thisWeek;
    ups[`wallets/${kid}/lastInterestWeek`] = thisWeek;
    if(earned > 0) Object.assign(ups, hist(kid, `🏦 Vault interest`, earned, 'save'));
  }
  if(Object.keys(ups).length) commit(ups);
}

function weekStats(kid, wk){
  let earned = 0; const days = new Set();
  for(const e of Object.values(S.log)){
    if(e.kid!==kid || e.status!=='approved' || weekKey(e.date)!==wk) continue;
    earned += e.awarded||0; days.add(e.date);
  }
  return {earned:r1(earned), days};
}

/* ---------- Actions ---------- */
function tickChore(kid, cid){
  const t = today();
  const existing = Object.values(S.log).find(e => e.kid===kid && e.chore===cid && e.date===t && e.status!=='rejected');
  if(existing) return;
  const c = S.chores[cid];
  commit({[`log/${uid()}`]:{kid, chore:cid, name:c.name, emoji:c.emoji, stars:c.stars, date:t, status:'pending', ts:Date.now()}});
  notify(`${S.kids[kid].name} says they've done: ${c.name}`);
  toast('Sent for approval');
}

function approve(logId){
  const e = S.log[logId]; if(!e || e.status!=='pending') return;
  const wk = weekKey(e.date), st = weekStats(e.kid, wk), w = wallet(e.kid);
  const room = Math.max(0, S.settings.weeklyCap - st.earned);
  const award = Math.min(e.stars, room);
  const ups = {[`log/${logId}/status`]:'approved', [`log/${logId}/awarded`]:award};
  let spend = w.spend + award;
  if(award>0) Object.assign(ups, hist(e.kid, `${e.emoji} ${e.name}`, award, 'spend'));
  const days = new Set(st.days); days.add(e.date);
  if(days.size >= S.settings.bonusDays && !(w.bonusWeeks||{})[wk]){
    spend += S.settings.bonusStars;
    ups[`wallets/${e.kid}/bonusWeeks/${wk}`] = true;
    Object.assign(ups, hist(e.kid, `🔥 Streak bonus – ${S.settings.bonusDays} days this week`, S.settings.bonusStars, 'spend'));
  }
  ups[`wallets/${e.kid}/spend`] = r1(spend);
  commit(ups);
}
function reject(logId){ commit({[`log/${logId}/status`]:'rejected'}); }

function moveToSavings(kid, amt){
  const w = wallet(kid); amt = r1(amt);
  if(amt<=0 || amt>w.spend) return toast('Not enough credits');
  commit(Object.assign({
    [`wallets/${kid}/spend`]: r1(w.spend-amt),
    [`wallets/${kid}/savings`]: r1(w.savings+amt)
  }, hist(kid,'Deposited to vault',amt,'save')));
}
function takeFromSavings(kid, amt){
  const w = wallet(kid); amt = r1(amt);
  if(amt<=0 || amt>w.savings) return toast('Not enough in the vault');
  const ns = r1(w.savings-amt);
  commit(Object.assign({
    [`wallets/${kid}/spend`]: r1(w.spend+amt),
    [`wallets/${kid}/savings`]: ns,
    [`wallets/${kid}/weekMin`]: Math.min(w.weekMin, ns)
  }, hist(kid,'Withdrawn from vault',-amt,'save')));
}
const REWARDS = {
  money:{label:'Pocket money', em:'💷'},
  robux:{label:'Robux', em:'🎮'},
  meta:{label:'Meta credit', em:'🥽'}
};
function requestClaim(kid, type, amt){
  const w = wallet(kid); amt = r1(amt);
  if(amt < S.settings.minClaim[type]) return toast(`Minimum is ${S.settings.minClaim[type]} credits`);
  if(amt > w.spend) return toast('Not enough credits');
  commit(Object.assign({
    [`wallets/${kid}/spend`]: r1(w.spend-amt),
    [`claims/${uid()}`]: {kid, type, stars:amt, value:r1(amt*S.settings.starValue*100)/100, status:'pending', ts:Date.now()}
  }, hist(kid, `${REWARDS[type].em} Claimed ${REWARDS[type].label}`, -amt, 'spend')));
  notify(`${S.kids[kid].name} wants to claim ${REWARDS[type].label}: £${(amt*S.settings.starValue).toFixed(2)}`);
  toast('Sent to parents for approval');
}
function settleClaim(id, ok){
  const c = S.claims[id]; if(!c || c.status!=='pending') return;
  const ups = {[`claims/${id}/status`]: ok ? 'paid' : 'declined'};
  if(!ok){ ups[`wallets/${c.kid}/spend`] = r1(wallet(c.kid).spend + c.stars); Object.assign(ups, hist(c.kid,'Redeem declined – refunded',c.stars,'spend')); }
  commit(ups);
}

/* ---------- UI state ---------- */
let view = sessionStorage.getItem('cs.view') || 'home'; // home | kid | parent
let kidId = sessionStorage.getItem('cs.kid') || null;
let ptab = 'approve', parentOK = false, modalOpen = false;
function go(v, k){ view=v; if(k!==undefined) kidId=k; sessionStorage.setItem('cs.view',v); if(kidId) sessionStorage.setItem('cs.kid',kidId); render(); scrollTo(0,0); }

function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function modal(html, mount){
  modalOpen = true;
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<div class="sheet">${html}</div>`;
  const close = () => { m.remove(); modalOpen=false; render(); };
  m.addEventListener('click', e => { if(e.target===m) close(); });
  document.body.appendChild(m);
  mount && mount(m.querySelector('.sheet'), close);
}
function syncLabel(){
  return {live:'🟢 Synced', local:'🟡 Demo mode', offline:'🔴 Offline', reconnecting:'🟠 Reconnecting', loading:'…'}[syncState];
}
function renderSync(){ const el=document.getElementById('sync'); if(el) el.textContent=syncLabel(); }

/* ---------- Render ---------- */
const $app = document.getElementById('app');
function render(){
  if(!S){ $app.innerHTML = '<p class="muted">Loading…</p>'; return; }
  if(view==='kid' && S.kids[kidId]) return renderKid();
  if(view==='parent') return renderParent();
  renderHome();
}

function header(back){
  return `<div class="top">
    ${back ? `<button class="ghost small" data-act="home">← Back</button>` : `<span class="logo"><i class="cr"></i>CHORE QUEST</span>`}

  </div>`;
}


const ART = {money:'linear-gradient(135deg,#0b7a4b,#00b06f)', robux:'linear-gradient(135deg,#2c3cb8,#335fff)', meta:'linear-gradient(135deg,#5b2bb5,#9b59ff)'};
function shopHTML(kid){
  const w = wallet(kid), v = S.settings.starValue;
  return `<div class="shop">${Object.entries(REWARDS).map(([t_,r])=>{
    const min = S.settings.minClaim[t_], can = w.spend >= min, pct = Math.min(100, w.spend/min*100);
    return `<div class="shopitem"><div class="art" style="background:${ART[t_]}"><span class="tag">${t_==='money'?'Cash':t_==='robux'?'Gaming':'VR'}</span>${r.em}</div>
      <div class="info"><div class="nm">${r.label}</div>
        <div class="price"><i class="cr"></i>${min}</div><div class="val">from £${(min*v).toFixed(2)}</div>
        ${can ? '' : `<div class="mini"><i style="width:${pct}%"></i></div><div class="val"><i class="cr"></i>${r1(min-w.spend)} to go</div>`}
        <button data-claim="${t_}" ${can?'':'disabled'}>${can?'Redeem':'Locked'}</button></div></div>`;
  }).join('')}</div>`;
}
function leaderboardHTML(me){
  const wk = weekKey(today());
  const rows = Object.keys(S.kids).map(id=>{
    const st = weekStats(id, wk);
    const quests = Object.values(S.log).filter(e=>e.kid===id && e.status==='approved' && weekKey(e.date)===wk).length;
    return {id, earned:st.earned, days:st.days.size, quests, bonus:!!(wallet(id).bonusWeeks||{})[wk]};
  }).sort((a,b)=> b.earned-a.earned || b.days-a.days || b.quests-a.quests);
  const top = Math.max(1, ...rows.map(r=>r.earned));
  const medal = (i,r) => r.earned===0 ? '–' : ['🥇','🥈','🥉'][i] || (i+1);
  return `<div class="lb">${rows.map((r,i)=>`<div class="lbrow ${r.id===me?'me':''}">
    <span class="rk">${medal(i,r)}</span>${avatar(r.id,'sm')}
    <div class="grow"><div class="nm"><span>${esc(S.kids[r.id].name)}</span><span><i class="cr"></i>${r1(r.earned)}</span></div>
      <div class="bar"><i style="width:${r.earned/top*100}%"></i></div>
      <div class="meta">${r.quests} quest${r.quests===1?'':'s'} · 🔥 ${r.days}/${S.settings.bonusDays} days${r.bonus?' · streak unlocked':''}</div></div></div>`).join('')}</div>`;
}

function amountSheet(title, max, onOk, extra='', min=0){
  const money = n => '£'+((+n||0)*S.settings.starValue).toFixed(2);
  modal(`<h2>${title}</h2>${extra}
    <label>Amount (you have ${fmtStars(max)})</label>
    <input type="number" inputmode="decimal" min="0" step="0.1" max="${max}" value="${Math.min(max, Math.max(min, Math.floor(max)))}" id="amt">
    <p class="muted" id="val"></p>
    <div class="grid2" style="margin-top:12px"><button class="ghost" data-x>Cancel</button><button data-ok>OK</button></div>`,
  (el, close)=>{
    const i = el.querySelector('#amt'), v = el.querySelector('#val');
    const upd = ()=> v.textContent = `= ${money(i.value)}`; upd(); i.oninput = upd;
    el.querySelector('[data-x]').onclick = close;
    el.querySelector('[data-ok]').onclick = ()=>{ const a=parseFloat(i.value); close(); if(a>0) onOk(a); };
  });
}

function growthSheet(current){
  const start = Math.max(current, 20);
  const rate = S.settings.interestRate/100, cap = S.settings.interestCap;
  const rows = [4,8,12,26].map(wks=>{ let s=start; for(let i=0;i<wks;i++) s = r1(s + Math.min(r1(s*rate), cap)); return [wks,s]; });
  modal(`<h2>📈 If you leave ${fmtStars(start)} in the vault…</h2>
    ${rows.map(([wks,s])=>`<div class="item"><span class="grow">After ${wks} weeks</span><b>${fmtStars(s)}</b><span class="muted">&nbsp;£${(s*S.settings.starValue).toFixed(2)}</span></div>`).join('')}
    <p class="muted">That's without adding anything else. Spend now, or wait and have more later – your call.</p>
    <button data-x style="width:100%;margin-top:10px">Got it</button>`,
  (el,close)=> el.querySelector('[data-x]').onclick = close);
}

function askPin(){
  if(parentOK) return go('parent');
  modal(`<h2>🔒 Parent mode</h2><p class="muted">Enter the PIN.</p>
    <div class="pin">${[0,1,2,3].map(i=>`<input type="password" inputmode="numeric" maxlength="1" data-i="${i}">`).join('')}</div>
    <button class="ghost" data-x style="width:100%">Cancel</button>`,
  (el, close)=>{
    const ins=[...el.querySelectorAll('input')]; ins[0].focus();
    ins.forEach((inp,i)=>inp.oninput=()=>{
      if(inp.value && i<3) ins[i+1].focus();
      const v = ins.map(x=>x.value).join('');
      if(v.length===4){
        if(v===String(S.settings.parentPin)){ parentOK=true; close(); go('parent'); }
        else { toast('Wrong PIN'); ins.forEach(x=>x.value=''); ins[0].focus(); }
      }
    });
    el.querySelector('[data-x]').onclick=close;
  });
}

function renderParent(){
  if(!parentOK) return go('home');
  const pendLog = Object.entries(S.log).filter(([,e])=>e.status==='pending').sort((a,b)=>a[1].ts-b[1].ts);
  const pendClaims = Object.entries(S.claims).filter(([,c])=>c.status==='pending');
  const tabs = [['approve',`Approve${pendLog.length+pendClaims.length?` (${pendLog.length+pendClaims.length})`:''}`],['kids','Kids'],['chores','Chores'],['rules','Rewards & rules'],['setup','Devices & sync']];
  let body = '';

  if(ptab==='approve'){
    body = `${!S.settings.pinChanged?`<div class="note" style="margin-bottom:14px">⚠️ The PIN is still <b>1234</b>. Change it in <b>Rewards & rules</b> before the kids guess it.</div>`:''}
    <div class="card"><h2>Chores to check</h2>
      ${pendLog.length ? `${pendLog.map(([id,e])=>`<div class="item"><span style="font-size:24px">${esc(e.emoji)}</span>
          <div class="grow"><b>${esc(S.kids[e.kid]?.name||'?')}</b> – ${esc(e.name)}<br><span class="muted">${e.date===today()?'Today':esc(e.date)} · <i class="cr"></i>${e.stars}</span></div>
          <button class="small bad" data-rej="${id}">✕</button><button class="small good" data-ok="${id}">✓</button></div>`).join('')}
          <button class="ghost small" data-allok style="margin-top:10px;width:100%">Approve all</button>`
        : '<p class="muted">All caught up 👍</p>'}
    </div>
    <div class="card"><h2>Reward claims</h2>
      ${pendClaims.length ? pendClaims.map(([id,c])=>`<div class="item"><span style="font-size:24px">${REWARDS[c.type].em}</span>
          <div class="grow"><b>${esc(S.kids[c.kid]?.name||'?')}</b> – ${REWARDS[c.type].label}<br><span class="muted"><i class="cr"></i>${c.stars} = <b>£${c.value.toFixed(2)}</b></span></div>
          <button class="small bad" data-cno="${id}">Decline</button><button class="small good" data-cok="${id}">Paid</button></div>`).join('')
        : '<p class="muted">No claims waiting.</p>'}
      <p class="muted" style="margin-top:8px">Tap <b>Paid</b> once you've handed it over or bought the Robux / Meta credit. <b>Decline</b> gives the credits back.</p>
    </div>`;
  }

  if(ptab==='kids'){
    body = `<div class="card"><h2>Kids</h2>
      ${Object.entries(S.kids).map(([id,k])=>{ const w=wallet(id), st=weekStats(id,weekKey(today()));
        return `<div class="item">${avatar(id,'sm')}<div class="grow"><b>${esc(k.name)}</b><br>
          <span class="muted">Balance ${fmtStars(w.spend)} · Vault ${fmtStars(w.savings)} · This week ${fmtStars(st.earned)} on ${st.days.size} day(s)</span></div>
          <button class="small ghost" data-adj="${id}">±</button><button class="small ghost" data-ek="${id}">Edit</button></div>`;}).join('')}
      <button class="ghost" data-addkid style="width:100%;margin-top:10px">+ Add child</button>
    </div>`;
  }

  if(ptab==='chores'){
    const list = Object.entries(S.chores).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    const maxDay = Math.max(...[0,1,2,3,4,5,6].map(d=>list.filter(([,c])=>c.days.includes(d)).reduce((s,[,c])=>s+c.stars,0)),0);
    body = `<div class="card"><h2>Chores</h2>
      ${list.map(([id,c])=>`<div class="item"><span style="font-size:24px">${esc(c.emoji)}</span><div class="grow"><b>${esc(c.name)}</b><br>
        <span class="muted"><i class="cr"></i>${c.stars} · ${c.days.length===7?'Every day':c.days.map(d=>DAYS[d]).join(' ')}</span></div>
        <button class="small ghost" data-ec="${id}">Edit</button></div>`).join('')}
      <button class="ghost" data-addchore style="width:100%;margin-top:10px">+ Add chore</button>
      <p class="muted" style="margin-top:10px">Busiest day is worth <i class="cr"></i>${maxDay}. Each chore can only be ticked once a day, and only for today – so there's no catching up a whole week in one go.</p>
    </div>`;
  }

  if(ptab==='rules'){
    const s = S.settings;
    const maxWeek = s.weeklyCap + s.bonusStars;
    body = `<div class="card"><h2>Rewards & rules</h2>
      <div class="grid2">
        <div><label>£ per credit</label><input type="number" step="0.01" id="starValue" value="${s.starValue}"></div>
        <div><label>Weekly credit cap (per child)</label><input type="number" id="weeklyCap" value="${s.weeklyCap}"></div>
        <div><label>Streak: days needed</label><input type="number" min="1" max="7" id="bonusDays" value="${s.bonusDays}"></div>
        <div><label>Streak bonus credits</label><input type="number" id="bonusStars" value="${s.bonusStars}"></div>
        <div><label>Bank interest % per week</label><input type="number" step="0.5" id="interestRate" value="${s.interestRate}"></div>
        <div><label>Max interest <i class="cr"></i> per week</label><input type="number" id="interestCap" value="${s.interestCap}"></div>
      </div>
      <h3 style="margin-top:16px">Minimum redeem (credits)</h3>
      <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
        <div><label>💷 Money</label><input type="number" id="min_money" value="${s.minClaim.money}"></div>
        <div><label>🎮 Robux</label><input type="number" id="min_robux" value="${s.minClaim.robux}"></div>
        <div><label>🥽 Meta</label><input type="number" id="min_meta" value="${s.minClaim.meta}"></div>
      </div>
      <div class="note" style="margin-top:14px" id="cost"></div>
      <label>Parent PIN (4 digits)</label><input type="text" inputmode="numeric" maxlength="4" id="pin" value="${esc(s.parentPin)}">
      <button data-saverules style="width:100%;margin-top:14px">Save</button>
    </div>`;
  }

  if(ptab==='setup'){
    const base = location.href.split('#')[0];
    const link = remote() ? `${base}#db=${encodeURIComponent(cfg.db)}&fam=${encodeURIComponent(cfg.fam)}` : '';
    body = `<div class="card"><h2>Devices & sync</h2>
      <p>Status: <b>${syncLabel()}</b></p>
      ${remote() ? `<p class="muted">Family code: <code>${esc(cfg.fam)}</code></p>
        <label>Setup link – open this once on each phone/iPad</label>
        <input readonly value="${esc(link)}" id="link"><button class="small ghost" data-copy style="margin-top:8px">Copy link</button>`
      : `<p class="muted">Right now everything is saved on this device only. To share between the kids' devices and your phones, connect a free Firebase database (instructions in the setup guide).</p>`}
      <label>Firebase database URL</label><input id="dburl" placeholder="https://your-project-default-rtdb.europe-west1.firebasedatabase.app" value="${esc(cfg.db||'')}">
      <label>Family code (make it long & random – it's your key)</label><input id="famcode" value="${esc(cfg.fam||('family-'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,8)))}">
      <div class="grid2" style="margin-top:12px"><button data-connect>Connect</button>${remote()?'<button class="ghost" data-disconnect>Disconnect this device</button>':''}</div>
      ${!remote() && Object.keys(S.log).length ? `<p class="muted">When you connect, this device's demo data will be uploaded if the family database is empty.</p>`:''}
    </div>
    <div class="card"><h2>📲 Alerts on your phone</h2>
      <p class="muted">Optional. Install the free <b>ntfy</b> app on your phone, subscribe to the topic below, and you'll get a ping when a chore or claim needs checking.</p>
      <label>ntfy topic (keep it unguessable)</label><input id="ntfy" value="${esc(S.settings.ntfyTopic||'')}" placeholder="e.g. ladbrook-chores-7h3k9q">
      <button class="small" data-ntfy style="margin-top:10px">Save & send test</button>
    </div>
    <div class="card"><h3>Danger zone</h3>
      <button class="bad small" data-reset>Reset all credits & history</button>
    </div>`;
  }

  $app.innerHTML = `${header(true)}<h1>Parent mode</h1>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="${ptab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>${body}`;

  const q = s => $app.querySelector(s), qa = s => $app.querySelectorAll(s);
  q('[data-act=home]').onclick = ()=>{ parentOK=false; go('home'); };
  qa('[data-tab]').forEach(b=>b.onclick=()=>{ ptab=b.dataset.tab; render(); });
  qa('[data-ok]').forEach(b=>b.onclick=()=>approve(b.dataset.ok));
  qa('[data-rej]').forEach(b=>b.onclick=()=>reject(b.dataset.rej));
  q('[data-allok]') && (q('[data-allok]').onclick = async ()=>{ for(const [id] of pendLog){ approve(id); await new Promise(r=>setTimeout(r,120)); } });
  qa('[data-cok]').forEach(b=>b.onclick=()=>settleClaim(b.dataset.cok,true));
  qa('[data-cno]').forEach(b=>b.onclick=()=>settleClaim(b.dataset.cno,false));
  qa('[data-ek]').forEach(b=>b.onclick=()=>editKid(b.dataset.ek));
  qa('[data-adj]').forEach(b=>b.onclick=()=>adjustKid(b.dataset.adj));
  q('[data-addkid]') && (q('[data-addkid]').onclick=()=>editKid(null));
  qa('[data-ec]').forEach(b=>b.onclick=()=>editChore(b.dataset.ec));
  q('[data-addchore]') && (q('[data-addchore]').onclick=()=>editChore(null));

  if(ptab==='rules'){
    const ids=['starValue','weeklyCap','bonusDays','bonusStars','interestRate','interestCap'];
    const cost = ()=>{ const v=+q('#starValue').value, cap=+q('#weeklyCap').value, b=+q('#bonusStars').value, ic=+q('#interestCap').value, n=Object.keys(S.kids).length;
      const per=(cap+b+ic)*v; q('#cost').innerHTML = `💡 Most this can ever cost: <b>£${per.toFixed(2)}</b> per child per week (chores + bonus + max interest) – about <b>£${(per*n*52/12).toFixed(2)}/month</b> for ${n} children if they hit every limit.`; };
    cost(); qa('#rules input, input').forEach(i=>i.addEventListener('input',cost));
    q('[data-saverules]').onclick = ()=>{
      const pin=q('#pin').value.trim();
      if(!/^\d{4}$/.test(pin)) return toast('PIN must be 4 digits');
      const ups={};
      ids.forEach(k=>ups[`settings/${k}`]=parseFloat(q('#'+k).value)||0);
      ['money','robux','meta'].forEach(t=>ups[`settings/minClaim/${t}`]=parseFloat(q('#min_'+t).value)||0);
      ups['settings/parentPin']=pin; if(pin!=='1234') ups['settings/pinChanged']=true;
      commit(ups); toast('Saved');
    };
  }
  if(ptab==='setup'){
    q('[data-copy]') && (q('[data-copy]').onclick=()=>{ const l=q('#link'); l.select(); navigator.clipboard?.writeText(l.value); toast('Copied'); });
    q('[data-connect]').onclick = async ()=>{
      const db=q('#dburl').value.trim().replace(/\/+$/,''), fam=q('#famcode').value.trim().replace(/[.#$\[\]\/]/g,'-');
      if(!/^https:\/\//.test(db) || !fam) return toast('Enter the database URL and a family code');
      try{
        const r=await fetch(`${db}/families/${encodeURIComponent(fam)}.json`); if(!r.ok) throw new Error('HTTP '+r.status);
        const existing=await r.json();
        if(!existing){ await fetch(`${db}/families/${encodeURIComponent(fam)}.json`,{method:'PUT',body:JSON.stringify(S)}); }
        cfg={db,fam}; saveCfg(cfg); toast('Connected!'); await load();
      }catch(e){ toast('Couldn\'t connect – check the URL and database rules'); }
    };
    q('[data-disconnect]') && (q('[data-disconnect]').onclick=()=>{ cfg={}; saveCfg(cfg); if(es) es.close(); load(); });
    q('[data-ntfy]').onclick=()=>{ const t=q('#ntfy').value.trim(); commit({'settings/ntfyTopic':t}).then(()=>{ if(t){ notify('Test – alerts are working 🎉'); toast('Test sent'); } }); };
    q('[data-reset]').onclick=()=>{ if(confirm('Reset everyone\'s credits, vaults and history? Chores, kids and settings stay.')) commit({log:null,wallets:null,claims:null,history:null}).then(applyInterest); };
  }
}

function editKid(id){
  const k = id ? S.kids[id] : {name:'', colour:COLOURS[Object.keys(S.kids).length%COLOURS.length]};
  let colour = k.colour || COLOURS[0]; let photo = k.photo || null;
  modal(`<h2>${id?'Edit':'Add'} child</h2>
    <label>Name</label><input id="n" value="${esc(k.name)}">
    <label>Picture</label><div class="row"><span id="pv">${avatar(id||'_','md')}</span><label class="ghost" style="margin:0;flex:1"><span class="pill" style="padding:10px 12px;display:block;text-align:center;cursor:pointer">Upload picture</span><input type="file" accept="image/*" id="ph" style="display:none"></label>${k.photo?'<button class="ghost small" data-rmph>Remove</button>':''}</div>
    <label>Colour</label><div class="colours">${COLOURS.map(c=>`<span data-c="${c}" style="background:${c}" class="${c===colour?'on':''}"></span>`).join('')}</div>
    <div class="grid2" style="margin-top:14px">${id?'<button class="bad" data-del>Remove</button>':'<button class="ghost" data-x>Cancel</button>'}<button data-ok>Save</button></div>`,
  (el,close)=>{
    const pv=el.querySelector('#pv'); const showPv=()=>{ pv.innerHTML = photo ? `<span class="av md" style="background:${colour} url('${photo}') center/cover"></span>` : `<span class="av md" style="background:${colour}">${esc((el.querySelector('#n').value||'?')[0]).toUpperCase()}</span>`; };
    el.querySelector('#ph').onchange = ev => { const f=ev.target.files[0]; if(!f) return; resizeImage(f, 160).then(d=>{ photo=d; showPv(); }).catch(()=>toast('Couldn\'t read that picture')); };
    el.querySelector('[data-rmph]') && (el.querySelector('[data-rmph]').onclick=()=>{ photo=null; showPv(); });
    el.querySelectorAll('[data-c]').forEach(sp=>sp.onclick=()=>{ colour=sp.dataset.c; showPv(); el.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===sp)); });
    el.querySelector('[data-x]') && (el.querySelector('[data-x]').onclick=close);
    el.querySelector('[data-del]') && (el.querySelector('[data-del]').onclick=()=>{ if(confirm('Remove this child and their credits?')){ commit({[`kids/${id}`]:null,[`wallets/${id}`]:null}); close(); }});
    el.querySelector('[data-ok]').onclick=()=>{ const n=el.querySelector('#n').value.trim(); if(!n) return; const nid=id||'k'+uid();
      const ups={[`kids/${nid}`]:Object.assign({name:n, colour}, photo?{photo}:{})};
      if(!id) ups[`wallets/${nid}`]=wallet(nid);
      commit(ups); close(); };
  });
}
function resizeImage(file, size){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82)); };
    img.onerror = rej; img.src = url;
  });
}
function adjustKid(id){
  modal(`<h2>Adjust ${esc(S.kids[id].name)}'s stars</h2>
    <p class="muted">For birthdays, one-off jobs, or fixing a mistake. Use a minus number to take credits away.</p>
    <label>Credits (+/−)</label><input type="number" step="0.1" id="a" value="5">
    <label>Reason</label><input id="r" value="Extra job – well done!">
    <div class="grid2" style="margin-top:14px"><button class="ghost" data-x>Cancel</button><button data-ok>Apply to balance</button></div>`,
  (el,close)=>{
    el.querySelector('[data-x]').onclick=close;
    el.querySelector('[data-ok]').onclick=()=>{ const a=parseFloat(el.querySelector('#a').value)||0; const w=wallet(id);
      commit(Object.assign({[`wallets/${id}/spend`]:Math.max(0,r1(w.spend+a))}, hist(id, '✏️ '+el.querySelector('#r').value, a, 'spend'))); close(); };
  });
}
function editChore(id){
  const c = id ? S.chores[id] : {name:'', emoji:'✨', stars:1, days:[0,1,2,3,4,5,6], order:Object.keys(S.chores).length+1};
  let days = [...c.days];
  modal(`<h2>${id?'Edit':'Add'} chore</h2>
    <label>Chore</label><input id="n" value="${esc(c.name)}">
    <div class="grid2"><div><label>Emoji</label><input id="e" value="${esc(c.emoji)}"></div><div><label>Credits</label><input type="number" step="0.5" id="s" value="${c.stars}"></div></div>
    <label>Which days?</label><div class="daypick">${[1,2,3,4,5,6,0].map(d=>`<span data-d="${d}" class="${days.includes(d)?'on':''}">${DAYS[d]}</span>`).join('')}</div>
    <div class="grid2" style="margin-top:14px">${id?'<button class="bad" data-del>Delete</button>':'<button class="ghost" data-x>Cancel</button>'}<button data-ok>Save</button></div>`,
  (el,close)=>{
    el.querySelectorAll('[data-d]').forEach(s=>s.onclick=()=>{ const d=+s.dataset.d; days = days.includes(d)?days.filter(x=>x!==d):[...days,d]; s.classList.toggle('on'); });
    el.querySelector('[data-x]') && (el.querySelector('[data-x]').onclick=close);
    el.querySelector('[data-del]') && (el.querySelector('[data-del]').onclick=()=>{ if(confirm('Delete this chore?')){ commit({[`chores/${id}`]:null}); close(); }});
    el.querySelector('[data-ok]').onclick=()=>{ const n=el.querySelector('#n').value.trim(); if(!n) return;
      commit({[`chores/${id||'c'+uid()}`]:{name:n, emoji:el.querySelector('#e').value.trim()||'✨', stars:parseFloat(el.querySelector('#s').value)||1, days:days.sort(), order:c.order}}); close(); };
  });
}

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && S){ applyInterest(); if(remote()) refetch(); else render(); }});
load();
</script>
